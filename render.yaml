# Render blueprint: the API as a Docker web service. Database is Neon Postgres (dev); Aurora in prod.
# Secrets (sync: false) are entered once in the Render dashboard, never committed.
services:
  - type: web
    name: strand-api
    runtime: docker
    rootDir: server
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    branch: strand
    envVars:
      - key: DATABASE_URL        # Neon *direct* (non-pooler) URL: LISTEN/NOTIFY needs it. Omit channel_binding=require (the Node driver lacks it)
        sync: false
      - key: PG_POOL
        value: "10"
      # Dev login (no Entra): callers must send x-dev-secret. The server refuses to start in production
      # mode with AUTH_DEV and no secret. For prod, delete AUTH_DEV + DEV_AUTH_SECRET and set ENTRA_*.
      - key: AUTH_DEV
        value: "1"
      - key: DEV_AUTH_SECRET
        generateValue: true       # Render creates it; read it in the dashboard for the frontend
      - key: DOCS_ENABLED        # Swagger UI at /docs on the dev deploy; remove for production
        value: "1"
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: SCIM_TOKEN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_REGION
        value: us-east-1
